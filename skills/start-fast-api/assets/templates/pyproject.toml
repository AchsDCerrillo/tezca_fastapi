[project]
name = "{{PROJECT_SLUG}}"
version = "0.1.0"
requires-python = ">={{PYTHON_VERSION}}"
# Dependencies are pinned in requirements.txt / requirements-dev.txt; this file configures the tooling.

[tool.ruff]
line-length = 120
extend-exclude = ["sql/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() in argument defaults is idiomatic
    "RUF012", # class-level mutable defaults are normal in Pydantic/SQLAlchemy models
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "{{PYTHON_VERSION}}"
files = ["app", "main.py", "tests"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false   # fixtures/helpers may stay lightly typed; bodies are still checked

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = ["integration: needs the test database"]
